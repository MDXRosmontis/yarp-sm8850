name: Build YARP SM8850

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yarp-sm8850-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      YARP_SOURCE_DIR: /build/yarp
      SYNC_JOBS: '8'
      BUILD_JOBS: '4'
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Allocate build storage on the disposable runner
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          build-mount-path: /build
          root-reserve-mb: '12288'
          temp-reserve-mb: '1024'
          swap-size-mb: '12288'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 lz4 cpio bc rsync \
            lzop kmod device-tree-compiler libssl-dev libncurses-dev repo
          git config --global user.name 'YARP Build'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          mkdir -p logs dist

      - name: Sync pinned YARP and SM8850 sources
        run: bash scripts/build-yarp.sh sync 2>&1 | tee logs/sync.log

      - name: Build recovery image
        run: bash scripts/build-yarp.sh build 2>&1 | tee logs/build.log

      - name: Verify and package recovery image
        run: bash scripts/build-yarp.sh package 2>&1 | tee logs/verification.log

      - name: Upload recovery image and source record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: YARP-sm8850-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: YARP-build-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
